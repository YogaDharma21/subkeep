name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Typecheck
        run: pnpm turbo run typecheck

      - name: Turbo Build
        run: pnpm turbo run build --filter=web --filter=desktop
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://dummy-preview.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummy_clerk_key"

      - name: Turbo Lint
        run: pnpm turbo run lint --filter=web
