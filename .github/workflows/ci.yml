name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'apps/website/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - '.github/workflows/ci.yml'

  build-website:
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/website/package-lock.json'

      - name: Install dependencies
        run: npm install
        working-directory: apps/website

      - name: Lint check
        run: npm run lint
        working-directory: apps/website

      - name: Type check
        run: npm run typecheck
        working-directory: apps/website

      - name: Next.js Build
        run: npm run build
        working-directory: apps/website
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://dummy-preview.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummy_clerk_key"

  lint-mobile:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Lint check
        run: npm run lint
        working-directory: apps/mobile

  build-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Type check
        run: npm run typecheck
        working-directory: apps/desktop

      - name: Build
        run: npm run build
        working-directory: apps/desktop
